<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>LUIMOTOR - ระบบข้อมูลลูกค้า V2.1</title>

<!-- OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

:root{
 --bg:#090909;
 --card:#151515;
 --card2:#101010;
 --red:#e00000;
 --red2:#ff3030;
 --text:#f5f5f5;
 --muted:#a7a7a7;
 --line:#292929;
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:linear-gradient(145deg,#080808,#160000);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
}

header{
 padding:24px 18px 16px;
 text-align:center;
 border-bottom:1px solid #300000;
 position:sticky;
 top:0;
 background:#090909ee;
 backdrop-filter:blur(10px);
 z-index:5;
}

.logo{
 font-weight:900;
 letter-spacing:2px;
 font-size:30px;
}

.logo span{
 color:var(--red);
}

.subtitle{
 color:var(--muted);
 margin-top:4px;
}

.version{
 display:inline-block;
 margin-top:8px;
 padding:4px 10px;
 border-radius:20px;
 background:#350000;
 color:#ff6b6b;
 font-size:12px;
 font-weight:700;
}

main{
 max-width:760px;
 margin:auto;
 padding:18px;
}

.card{
 background:linear-gradient(180deg,#171717,#101010);
 border:1px solid var(--line);
 border-radius:18px;
 padding:16px;
 margin-bottom:14px;
 box-shadow:0 8px 30px #0008;
}

h2{
 font-size:18px;
 margin:0 0 12px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

button{
 width:100%;
 border:0;
 border-radius:14px;
 padding:15px 12px;
 font-size:16px;
 font-weight:700;
 color:white;
 background:#222;
 cursor:pointer;
}

button.primary{
 background:linear-gradient(135deg,#c40000,#ff1e1e);
}

button.secondary{
 background:#292929;
}

button.danger{
 background:#450000;
}

button:active{
 transform:scale(.98);
}

input,textarea{
 width:100%;
 background:#0b0b0b;
 color:#fff;
 border:1px solid #333;
 border-radius:12px;
 padding:13px;
 font-size:16px;
 outline:none;
 margin-bottom:10px;
}

input:focus,textarea:focus{
 border-color:var(--red);
}

textarea{
 min-height:80px;
 resize:vertical;
}

.hidden{
 display:none;
}

.result{
 padding:12px;
 border:1px solid #333;
 border-radius:12px;
 margin-top:10px;
 background:#0d0d0d;
}

.result.clickable{
 cursor:pointer;
}

.badge{
 display:inline-block;
 padding:4px 9px;
 border-radius:99px;
 background:#350000;
 color:#ff6b6b;
 font-size:12px;
}

.item{
 padding:14px 0;
 border-bottom:1px solid #252525;
}

.item:last-child{
 border-bottom:0;
}

.small{
 font-size:13px;
 color:var(--muted);
}

.price{
 font-weight:800;
 color:#ff5555;
}

.empty{
 color:#888;
 text-align:center;
 padding:20px;
}

.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:10px;
}

hr{
 border:0;
 border-top:1px solid #252525;
 margin:15px 0;
}

.back{
 margin-bottom:12px;
}

.stat{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin-top:12px;
}

.statBox{
 background:#0b0b0b;
 border:1px solid #292929;
 border-radius:12px;
 padding:12px 5px;
 text-align:center;
}

.statNumber{
 font-size:20px;
 font-weight:800;
 color:#ff5555;
}

.statLabel{
 font-size:12px;
 color:#999;
}

.scanBox{
 border:1px dashed #550000;
 border-radius:14px;
 padding:14px;
 margin-top:10px;
 background:#100000;
}

.scanStatus{
 color:#ff7777;
 font-size:14px;
 line-height:1.6;
 margin-top:8px;
}

.ocrResult{
 font-size:22px;
 font-weight:900;
 text-align:center;
 letter-spacing:2px;
 padding:12px;
 color:#ff5555;
}

@media(max-width:520px){

 .grid{
  grid-template-columns:1fr 1fr;
 }

 .logo{
  font-size:27px;
 }

 .actions{
  grid-template-columns:1fr 1fr;
 }

}

</style>
</head>

<body>

<header>

<div class="logo">
LUI<span>MOTOR</span>
</div>

<div class="subtitle">
ระบบข้อมูลลูกค้า V2
</div>

<div class="version">
VERSION 2.1
</div>

</header>


<main>


<!-- SEARCH -->

<section class="card">

<h2>🔎 ค้นหาข้อมูลลูกค้า</h2>

<input
 id="search"
 placeholder="ทะเบียน / ชื่อลูกค้า / เบอร์โทร"
 oninput="searchCustomers()">

<div id="results" class="empty">
ยังไม่มีข้อมูลลูกค้า
</div>

</section>


<!-- QUICK MENU -->

<section class="card">

<h2>⚡ เมนูด่วน</h2>

<div class="grid">

<button
 class="primary"
 onclick="show('customerForm')">
➕ เพิ่มลูกค้า
</button>


<button
 onclick="show('vehicleForm')">
🏍️ เพิ่มรถให้ลูกค้า
</button>


<button
 class="primary"
 onclick="startScan()">
📷 สแกนทะเบียน
</button>


<button
 onclick="showAll()">
📋 ลูกค้าทั้งหมด
</button>

</div>

</section>


<!-- SCAN -->

<section
 id="scanSection"
 class="card hidden">

<h2>
📷 สแกนทะเบียน
</h2>

<div class="scanBox">

<div class="small">
ถ่ายภาพป้ายทะเบียนให้เห็นชัดที่สุด
</div>

<div
 id="scanStatus"
 class="scanStatus">
พร้อมสแกนทะเบียน
</div>

<div
 id="ocrResult"
 class="ocrResult hidden">
</div>

</div>

<input
 id="scanFile"
 type="file"
 accept="image/*"
 capture="environment"
 class="hidden"
 onchange="processScan(event)">

<button
 class="primary"
 style="margin-top:12px"
 onclick="openCamera()">
📷 เปิดกล้องถ่ายป้ายทะเบียน
</button>

<button
 style="margin-top:8px"
 onclick="closeScan()">
ปิด
</button>

</section>


<!-- CUSTOMER -->

<section
 id="customerForm"
 class="card hidden">

<h2>
👤 เพิ่มลูกค้าใหม่
</h2>

<input
 id="cname"
 placeholder="ชื่อลูกค้า *">

<input
 id="cphone"
 placeholder="เบอร์โทร">

<textarea
 id="cnote"
 placeholder="หมายเหตุ">
</textarea>

<button
 class="primary"
 onclick="addCustomer()">
💾 บันทึกลูกค้า
</button>

</section>


<!-- VEHICLE -->

<section
 id="vehicleForm"
 class="card hidden">

<h2>
🏍️ เพิ่มรถให้ลูกค้า
</h2>

<input
 id="vcustomer"
 placeholder="ชื่อลูกค้า *">

<input
 id="vplate"
 placeholder="ทะเบียนรถ *">

<input
 id="vbrand"
 placeholder="ยี่ห้อ">

<input
 id="vmodel"
 placeholder="รุ่น">

<input
 id="vcolor"
 placeholder="สี">

<input
 id="vmileage"
 placeholder="เลขไมล์">

<button
 class="primary"
 onclick="addVehicle()">
💾 บันทึกรถ
</button>

</section>


<!-- PROFILE -->

<section
 id="profile"
 class="card hidden">
</section>


<!-- DATA -->

<section class="card">

<h2>
💾 ข้อมูล
</h2>

<div class="grid">

<button
 onclick="exportData()">
📤 ส่งออกข้อมูล
</button>

<button
 onclick="importData()">
📥 นำเข้าข้อมูล
</button>

</div>

<input
 id="file"
 type="file"
 accept=".json"
 class="hidden"
 onchange="loadData(event)">

<p class="small">
V2.1 ใช้ฐานข้อมูล LocalStorage เดิมของ V1/V2
ข้อมูลเดิมยังสามารถใช้งานต่อได้
</p>

</section>


</main>


<script>

/* ==================================================
DATABASE
================================================== */

const KEY='luimotor_v1';

let db;

try{

 db=JSON.parse(
  localStorage.getItem(KEY) ||
  '{"customers":[]}'
 );

 if(!db.customers){
  db.customers=[];
 }

}catch(e){

 db={
  customers:[]
 };

}


/* ==================================================
SAVE
================================================== */

function save(){

 localStorage.setItem(
  KEY,
  JSON.stringify(db)
 );

}


/* ==================================================
SHOW
================================================== */

function show(id){

 const el=document.getElementById(id);

 el.classList.remove('hidden');

 el.scrollIntoView({
  behavior:'smooth'
 });

}


/* ==================================================
ESCAPE
================================================== */

function esc(s=''){

 return String(s).replace(
  /[&<>"']/g,
  m=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  }[m])
 );

}


/* ==================================================
ADD CUSTOMER
================================================== */

function addCustomer(){

 let name=
 document.getElementById('cname')
 .value.trim();

 if(!name){

  alert('กรุณาใส่ชื่อลูกค้า');

  return;

 }

 let phone=
 document.getElementById('cphone')
 .value.trim();

 let note=
 document.getElementById('cnote')
 .value.trim();

 db.customers.push({

  id:Date.now(),

  name:name,

  phone:phone,

  note:note,

  vehicles:[]

 });

 save();

 document.getElementById('cname').value='';
 document.getElementById('cphone').value='';
 document.getElementById('cnote').value='';

 alert('บันทึกลูกค้าแล้ว');

 searchCustomers();

}


/* ==================================================
ADD VEHICLE
================================================== */

function addVehicle(){

 let name=
 document.getElementById('vcustomer')
 .value.trim();

 let plate=
 document.getElementById('vplate')
 .value.trim();

 if(!name || !plate){

  alert(
   'กรุณาใส่ชื่อลูกค้าและทะเบียน'
  );

  return;

 }

 let c=db.customers.find(
  x=>x.name===name
 );

 if(!c){

  c={

   id:Date.now(),

   name:name,

   phone:'',

   note:'',

   vehicles:[]

  };

  db.customers.push(c);

 }

 if(!c.vehicles){
  c.vehicles=[];
 }

 c.vehicles.push({

  id:Date.now(),

  plate:plate,

  brand:
  document.getElementById('vbrand')
  .value.trim(),

  model:
  document.getElementById('vmodel')
  .value.trim(),

  color:
  document.getElementById('vcolor')
  .value.trim(),

  mileage:
  document.getElementById('vmileage')
  .value.trim(),

  history:[]

 });

 save();

 [
  'vcustomer',
  'vplate',
  'vbrand',
  'vmodel',
  'vcolor',
  'vmileage'
 ].forEach(id=>{

  document.getElementById(id).value='';

 });

 alert('บันทึกรถแล้ว');

 searchCustomers();

}


/* ==================================================
SEARCH
================================================== */

function searchCustomers(){

 let q=
 document.getElementById('search')
 .value
 .trim()
 .toLowerCase();

 let arr=db.customers.filter(c=>{

  let name=(c.name||'').toLowerCase();

  let phone=(c.phone||'').toLowerCase();

  let vehicles=c.vehicles||[];

  return(
   !q ||
   name.includes(q) ||
   phone.includes(q) ||
   vehicles.some(v=>
    (v.plate||'')
    .toLowerCase()
    .includes(q)
   )
  );

 });

 let box=
 document.getElementById('results');

 if(!arr.length){

  box.className='empty';

  box.textContent=
  q
  ? 'ไม่พบข้อมูล'
  : 'ยังไม่มีข้อมูลลูกค้า';

  return;

 }

 box.className='';

 box.innerHTML=
 arr.map(c=>`

 <div
  class="result clickable"
  onclick="profile(${c.id})">

  <b>
   👤 ${esc(c.name)}
  </b>

  <br>

  <span class="small">

   📞 ${esc(c.phone||'-')}

   · รถ ${(c.vehicles||[]).length} คัน

  </span>

  ${
   (c.vehicles||[])
   .map(v=>`

    <div class="small">

     🏍️

     <b>
      ${esc(v.plate)}
     </b>

     ${esc(v.brand||'')}

     ${esc(v.model||'')}

    </div>

   `).join('')
  }

 </div>

 `).join('');

}


/* ==================================================
SHOW ALL
================================================== */

function showAll(){

 document.getElementById('search').value='';

 searchCustomers();

 document
 .getElementById('results')
 .scrollIntoView({
  behavior:'smooth'
 });

}


/* ==================================================
PROFILE
================================================== */

function profile(id){

 let c=db.customers.find(
  x=>x.id===id
 );

 if(!c)return;

 if(!c.vehicles){
  c.vehicles=[];
 }

 let p=
 document.getElementById('profile');

 p.classList.remove('hidden');

 let totalHistory=0;

 c.vehicles.forEach(v=>{

  if(!v.history){
   v.history=[];
  }

  totalHistory+=v.history.length;

 });


 p.innerHTML=`

 <button
  class="secondary back"
  onclick="hideProfile()">
  ← กลับ
 </button>


 <h2>
 👤 ${esc(c.name)}
 </h2>


 <div class="small">
 📞 ${esc(c.phone||'-')}
 </div>


 <div class="small">
 ${esc(c.note||'')}
 </div>


 <div class="stat">

  <div class="statBox">

   <div class="statNumber">
    ${c.vehicles.length}
   </div>

   <div class="statLabel">
    รถ
   </div>

  </div>


  <div class="statBox">

   <div class="statNumber">
    ${totalHistory}
   </div>

   <div class="statLabel">
    ประวัติซ่อม
   </div>

  </div>


  <div class="statBox">

   <div class="statNumber">
    ${c.phone?'✓':'-'}
   </div>

   <div class="statLabel">
    เบอร์โทร
   </div>

  </div>

 </div>


 <div class="actions">

  <button
   onclick="editCustomer(${c.id})">
   ✏️ แก้ไขลูกค้า
  </button>


  <button
   class="danger"
   onclick="deleteCustomer(${c.id})">
   🗑️ ลบลูกค้า
  </button>

 </div>


 <hr>


 <h2>
 🏍️ รถของลูกค้า
 </h2>


 ${
  c.vehicles.length

  ?

  c.vehicles.map(v=>`

  <div class="item">

   <span class="badge">
    ${esc(v.plate)}
   </span>

   <br>

   <b>
    ${esc(v.brand||'')}
    ${esc(v.model||'')}
   </b>


   <div class="small">
    สี ${esc(v.color||'-')}
    · ไมล์ ${esc(v.mileage||'-')}
   </div>


   <div class="actions">

    <button
     onclick="editVehicle(${c.id},${v.id})">
     ✏️ แก้ไขรถ
    </button>


    <button
     class="danger"
     onclick="deleteVehicle(${c.id},${v.id})">
     🗑️ ลบรถ
    </button>

   </div>


   <button
    class="primary"
    style="margin-top:9px"
    onclick="addHistory(${c.id},${v.id})">

    🔧 เพิ่มประวัติซ่อม

   </button>


   ${
    v.history.length

    ?

    `
    <div style="margin-top:8px">

    ${
     v.history
     .slice()
     .reverse()
     .map((h,i)=>`

      <div class="result">

       <b>
        ${esc(h.date)}
       </b>

       <br>

       ${esc(h.text)}

       ${
        h.price
        ?
        `<span class="price">
         ${esc(h.price)} บาท
        </span>`
        :
        ''
       }


       <br>


       <button
        class="danger"
        style="margin-top:8px;padding:8px;font-size:13px"
        onclick="deleteHistory(${c.id},${v.id},${v.history.length-1-i})">

        🗑️ ลบประวัติ

       </button>

      </div>

     `).join('')
    }

    </div>
    `

    :

    `<div
     class="small"
     style="margin-top:8px">

     ยังไม่มีประวัติซ่อม

    </div>`

   }

  </div>

  `).join('')

  :

  `<div class="empty">
   ยังไม่มีรถ
  </div>`
 }

 `;


 p.scrollIntoView({
  behavior:'smooth'
 });

}


/* ==================================================
HIDE PROFILE
================================================== */

function hideProfile(){

 document
 .getElementById('profile')
 .classList.add('hidden');

}


/* ==================================================
EDIT CUSTOMER
================================================== */

function editCustomer(id){

 let c=db.customers.find(
  x=>x.id===id
 );

 if(!c)return;


 let name=prompt(
  'ชื่อลูกค้า',
  c.name
 );

 if(name===null)return;

 name=name.trim();

 if(!name){

  alert(
   'ชื่อลูกค้าห้ามว่าง'
  );

  return;

 }


 let phone=prompt(
  'เบอร์โทร',
  c.phone||''
 );

 if(phone===null)return;


 let note=prompt(
  'หมายเหตุ',
  c.note||''
 );

 if(note===null)return;


 c.name=name;
 c.phone=phone.trim();
 c.note=note.trim();


 save();

 profile(id);

 searchCustomers();

}


/* ==================================================
DELETE CUSTOMER
================================================== */

function deleteCustomer(id){

 let c=db.customers.find(
  x=>x.id===id
 );

 if(!c)return;


 let ok=confirm(
  'ต้องการลบลูกค้า "'+
  c.name+
  '" ใช่หรือไม่?\n\n'+
  'ข้อมูลรถและประวัติซ่อมของลูกค้าคนนี้จะถูกลบด้วย'
 );

 if(!ok)return;


 db.customers=
 db.customers.filter(
  x=>x.id!==id
 );


 save();

 hideProfile();

 searchCustomers();

}


/* ==================================================
EDIT VEHICLE
================================================== */

function editVehicle(cid,vid){

 let c=db.customers.find(
  x=>x.id===cid
 );

 if(!c)return;


 let v=c.vehicles.find(
  x=>x.id===vid
 );

 if(!v)return;


 let plate=prompt(
  'ทะเบียนรถ',
  v.plate
 );

 if(plate===null)return;


 let brand=prompt(
  'ยี่ห้อ',
  v.brand||''
 );

 if(brand===null)return;


 let model=prompt(
  'รุ่น',
  v.model||''
 );

 if(model===null)return;


 let color=prompt(
  'สี',
  v.color||''
 );

 if(color===null)return;


 let mileage=prompt(
  'เลขไมล์',
  v.mileage||''
 );

 if(mileage===null)return;


 v.plate=plate.trim();
 v.brand=brand.trim();
 v.model=model.trim();
 v.color=color.trim();
 v.mileage=mileage.trim();


 save();

 profile(cid);

 searchCustomers();

}


/* ==================================================
DELETE VEHICLE
================================================== */

function deleteVehicle(cid,vid){

 let c=db.customers.find(
  x=>x.id===cid
 );

 if(!c)return;


 let v=c.vehicles.find(
  x=>x.id===vid
 );

 if(!v)return;


 let ok=confirm(
  'ต้องการลบรถทะเบียน '+
  v.plate+
  ' ใช่หรือไม่?\n\n'+
  'ประวัติซ่อมของรถคันนี้จะถูกลบด้วย'
 );

 if(!ok)return;


 c.vehicles=
 c.vehicles.filter(
  x=>x.id!==vid
 );


 save();

 profile(cid);

 searchCustomers();

}


/* ==================================================
ADD HISTORY
================================================== */

function addHistory(cid,vid){

 let text=prompt(
  'รายการซ่อม / งานที่ทำ'
 );

 if(text===null)return;

 text=text.trim();

 if(!text){

  alert(
   'กรุณาใส่รายการซ่อม'
  );

  return;

 }


 let price=prompt(
  'ราคา (บาท) — ถ้าไม่มีให้เว้นว่าง',
  ''
 );

 if(price===null)return;


 let c=db.customers.find(
  x=>x.id===cid
 );

 if(!c)return;


 let v=c.vehicles.find(
  x=>x.id===vid
 );

 if(!v)return;


 if(!v.history){
  v.history=[];
 }


 v.history.push({

  date:
  new Date()
  .toLocaleDateString('th-TH'),

  text:text,

  price:price.trim()

 });


 save();

 profile(cid);

}


/* ==================================================
DELETE HISTORY
================================================== */

function deleteHistory(cid,vid,index){

 let c=db.customers.find(
  x=>x.id===cid
 );

 if(!c)return;


 let v=c.vehicles.find(
  x=>x.id===vid
 );

 if(!v)return;


 let ok=confirm(
  'ต้องการลบประวัติซ่อมรายการนี้หรือไม่?'
 );

 if(!ok)return;


 v.history.splice(index,1);

 save();

 profile(cid);

}

/* ==================================================
NORMALIZE PLATE
================================================== */

function normalizePlate(text){

 return String(text||'')

  .replace(/\s+/g,'')

  .replace(/[|]/g,'')

  .trim()

  .toUpperCase();

}


/* ==================================================
CLEAN OCR
================================================== */

function cleanPlate(text){

 let t=String(text||'');

 t=t.replace(/\n/g,' ');

 t=t.replace(/[^\u0E00-\u0E7F0-9A-Zก-ฮ]/gi,'');

 return normalizePlate(t);

}


/* ==================================================
FIND PLATE
================================================== */

function findVehicleByPlate(plate){

 let target=
 normalizePlate(plate);

 for(let c of db.customers){

  for(let v of (c.vehicles||[])){

   if(
    normalizePlate(v.plate)===target
   ){

    return {
     customer:c,
     vehicle:v
    };

   }

  }

 }

 return null;

}


/* ==================================================
OCR SCAN
================================================== */

async function processScan(event){

 let file=
 event.target.files[0];

 if(!file)return;


 let status=
 document.getElementById('scanStatus');

 let result=
 document.getElementById('ocrResult');


 result.classList.add('hidden');

 status.textContent=
 '⏳ กำลังอ่านป้ายทะเบียน...';


 try{

  const worker=
   await Tesseract.createWorker(
    ['tha','eng'],
    1,
    {
     logger:m=>{

      if(m.status){

       let percent=
        m.progress
        ?
        Math.round(m.progress*100)
        :
        0;

       status.textContent=
        '⏳ '+m.status+
        (percent
        ? ' '+percent+'%'
        : '');

      }

     }
    }
   );


  const output=
   await worker.recognize(file);


  await worker.terminate();


  let raw=
   output.data.text||'';


  let plate=
   cleanPlate(raw);


  if(!plate){

   status.textContent=
    '❌ อ่านทะเบียนไม่สำเร็จ';

   alert(
    'อ่านทะเบียนไม่สำเร็จครับ\n\n'+
    'ลองถ่ายใหม่ให้ป้ายทะเบียนชัดขึ้น'
   );

   event.target.value='';

   return;

  }


  result.textContent=
   'ทะเบียนที่อ่านได้: '+plate;

  result.classList.remove('hidden');


  status.textContent=
   '✅ อ่านทะเบียนแล้ว';


  /* --------------------------------
     CHECK EXISTING
  -------------------------------- */


  let found=
   findVehicleByPlate(plate);


  if(found){

   status.textContent=
    '✅ พบข้อมูลรถคันนี้ในระบบแล้ว';


   alert(
    'พบทะเบียน '+
    found.vehicle.plate+
    ' ในระบบแล้ว\n\n'+
    'กำลังเปิดข้อมูลลูกค้า'
   );


   closeScan();

   profile(found.customer.id);

   event.target.value='';

   return;

  }


  /* --------------------------------
     NEW PLATE
  -------------------------------- */


  document
   .getElementById('vplate')
   .value=plate;


  status.textContent=
   '🆕 ยังไม่มีทะเบียนนี้ในระบบ';


  alert(
   'ยังไม่พบทะเบียนนี้ในระบบ\n\n'+
   'ระบบใส่ทะเบียนให้ในช่องกรอกแล้ว\n'+
   'พี่ตรวจสอบและแก้ไขได้ก่อนบันทึก'
  );


  closeScan();

  show('vehicleForm');


  document
   .getElementById('vplate')
   .focus();


  event.target.value='';


 }catch(error){

  console.error(error);


  status.textContent=
   '❌ เกิดข้อผิดพลาดในการอ่านภาพ';


  alert(
   'เกิดข้อผิดพลาดในการอ่านป้ายทะเบียน\n\n'+
   'ลองถ่ายภาพใหม่อีกครั้ง'
  );


  event.target.value='';

 }

}

}
